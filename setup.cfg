[metadata]
name = tapo-lang
version = 0.0.1
description = TAPO - a small, expressive, object-oriented language with aspects and pattern matching
long_description = file: README.md
long_description_content_type = text/markdown
author = X4CE
license = MIT
license_files = LICENSE
url = https://github.com/X4CE/tapo
keywords = language, interpreter, oop, aop, pattern-matching
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    tapo = tapo.cli:main

[options.data_files]
share/tapo/std =
    std/*.takg
